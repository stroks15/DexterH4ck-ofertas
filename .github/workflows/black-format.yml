name: Black format (temporal)

# Solo corre al hacer push a esta rama. NO corre en main.
# Borrar este archivo antes de fusionar el PR.
on:
  push:
    branches:
      - chore/black-format

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Formatear con black
        run: |
          python -m pip install "black==26.10.1"
          black .

      - name: Validar sintaxis
        run: python -m compileall -q .

      - name: Commit del formateo
        run: |
          git config user.name "black-bot"
          git config user.email "black-bot@users.noreply.github.com"
          git add -A -- '*.py'
          if git diff --cached --quiet; then
            echo "Nada que formatear."
            exit 0
          fi
          git commit -m "style: formatea con black 26.10.1 (line-length 120)"
          git push origin HEAD:${{ github.ref_name }}
