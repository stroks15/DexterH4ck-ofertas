name: Descubrir APIs JSON de una tienda

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL pública de búsqueda o categoría a inspeccionar"
        required: true
        type: string
      wait_ms:
        description: "Milisegundos de espera después de cargar la página"
        required: false
        default: "7000"
        type: string

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencia de navegador
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Capturar endpoints JSON
        env:
          NETWORK_DISCOVERY_URL: ${{ inputs.url }}
          NETWORK_DISCOVERY_WAIT_MS: ${{ inputs.wait_ms }}
        run: |
          python tools/descubrir_apis_navegador.py
          cat network_endpoints.json
      - name: Publicar diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: network-endpoints
          path: network_endpoints.json
