name: Monitor de descuentos
on:
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"
      - "requirements.txt"
      - "config/**"
      - "tests/**"
  schedule:
    # Cada 15 minutos, desplazado 7 minutos para evitar el pico de cada hora.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monitor-ofertas
  cancel-in-progress: false
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verificar secretos de Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_TOKEN" || { echo "::error::Falta el secret TELEGRAM_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "::error::Falta el secret TELEGRAM_CHAT_ID"; exit 1; }
          echo "Secretos de Telegram detectados correctamente."
      - name: Verificar credenciales de IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || echo "::warning::GEMINI_API_KEY no está configurada; el monitor funcionará sin Gemini."
          test -n "$GROQ_API_KEY" || echo "::warning::GROQ_API_KEY no está configurada; el monitor funcionará sin Groq."

      - name: Verificar token opcional de Mercado Libre
        env:
          MERCADOLIBRE_ACCESS_TOKEN: ${{ secrets.MERCADOLIBRE_ACCESS_TOKEN }}
        run: |
          if [ -n "$MERCADOLIBRE_ACCESS_TOKEN" ]; then
            echo "Token de Mercado Libre detectado; se habilitará enriquecimiento oficial de precios."
          else
            echo "::notice::MERCADOLIBRE_ACCESS_TOKEN no configurado; Mercado Libre seguirá usando búsqueda pública + historial."
          fi

      - name: Validar sintaxis Python
        run: python -m py_compile monitor_ofertas.py scrapers/tiendas_mexico.py scrapers/telegram_ofertas.py scrapers/liquidaciones_oficiales.py core/ai_reparador.py core/liquidation_engine.py core/extreme_liquidation.py scrapers/tiendas_fisicas.py core/scraper_base.py scrapers/api_stores.py config/walmart_graphql_query.py scrapers/walmart_graphql.py scrapers/bodega_graphql.py scrapers/walmart_api.py scrapers/bodega_aurrera_api.py scrapers/mercado_libre_api.py scrapers/feeds_comunidad_api.py reenviar_historial.py
      - name: Pruebas deterministas de liquidaciones extremas
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Preflight - detectar errores antes del monitor
        run: |
          python preflight.py
          cat preflight.env >> "$GITHUB_ENV"

      - name: Guardar diagnóstico de preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-health
          path: preflight_health.json
          if-no-files-found: ignore

      - name: Ejecutar monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          GEMINI_MAX_CALLS: "6"
          GEMINI_MIN_DELAY: "3.0"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          GROQ_MAX_CALLS: "8"
          GROQ_MIN_DELAY: "1.5"
          # Token opcional de Mercado Libre. Si no existe, se conserva el fallback al historial.
          MERCADOLIBRE_ACCESS_TOKEN: ${{ secrets.MERCADOLIBRE_ACCESS_TOKEN }}
          ML_PRICE_LOOKUPS: "40"
          ML_OFFICIAL_ONLY: "true"
          ML_API_LIMIT: "50"
          ML_API_TIMEOUT: "12"
          ML_API_DELAY: "0.20"
          PROMODESCUENTOS_RSS_URL: "https://promodescuentos.com/rss"
          # Endpoints GraphQL se configuran solo si la integración autorizada está disponible.
          WALMART_GRAPHQL_URL: ${{ vars.WALMART_GRAPHQL_URL }}
          BODEGA_GRAPHQL_URL: ${{ vars.BODEGA_GRAPHQL_URL }}
          WALMART_STORE_ID: ${{ vars.WALMART_STORE_ID }}
          BODEGA_STORE_ID: ${{ vars.BODEGA_STORE_ID }}
        run: python monitor_ofertas.py
      - name: Guardar historial sin conflictos de rebase
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f historial_ofertas.json ]; then
            echo "No se generó historial_ofertas.json; no hay cambios que guardar."
            exit 0
          fi
          git config user.name "bot-ofertas"
          git config user.email "bot-ofertas@users.noreply.github.com"
          cp historial_ofertas.json /tmp/historial_local.json

          for intento in 1 2 3; do
            git fetch origin main
            git checkout origin/main -- historial_ofertas.json 2>/dev/null || true

            python - <<'PY'
          import json
          from pathlib import Path

          local_path = Path("/tmp/historial_local.json")
          remote_path = Path("historial_ofertas.json")

          def load(path):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  return data if isinstance(data, dict) else {}
              except (OSError, json.JSONDecodeError):
                  return {}

          local = load(local_path)
          remote = load(remote_path)
          merged = dict(remote)

          for key, value in local.items():
              if key not in merged:
                  merged[key] = value
                  continue
              old = merged[key] if isinstance(merged[key], dict) else {}
              new = value if isinstance(value, dict) else {}
              old_ts = str(old.get("ultima_actualizacion", ""))
              new_ts = str(new.get("ultima_actualizacion", ""))
              if new_ts >= old_ts:
                  merged[key] = new

          remote_path.write_text(
              json.dumps(merged, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

            git add historial_ofertas.json
            if git diff --cached --quiet; then
              echo "El historial ya está actualizado."
              exit 0
            fi
            git commit -m "Actualiza historial de ofertas [skip ci]"
            if git push origin HEAD:main; then
              echo "Historial actualizado correctamente."
              exit 0
            fi
            git reset --soft HEAD~1
            git checkout -- historial_ofertas.json
            cp /tmp/historial_local.json historial_ofertas.json
            sleep 3
          done

          echo "::error::No se pudo actualizar historial_ofertas.json después de 3 intentos."
          exit 1

      - name: Guardar diagnóstico final del monitor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-health-final
          path: preflight_health.json
          if-no-files-found: ignore
