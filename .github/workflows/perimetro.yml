name: Verificar perímetro
on:
  pull_request:
    paths:
      - 'perimetro/**'
      - 'core/scrapling_motor.py'
      - 'scrapers/scrapling_adaptador.py'
      - 'config/perimetro_tiendas.json'
      - 'config/scrapling_motor.json'
      - 'requirements-*.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Instalar dependencias base
        run: python -m pip install -r requirements.txt
      - name: Verificar degradación opcional
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tools/verificar_motor.py
          python -m perimetro doctor
          python -m perimetro probe --tienda elektra --q liquidacion
          python -m pip uninstall -y scrapling || true
          python -m perimetro doctor
          python -c "import monitor_ofertas; print('monitor import OK')"
