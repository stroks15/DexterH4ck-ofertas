name: Regression CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validar sintaxis de todo el código Python
        run: |
          python - <<'PY'
          import pathlib, py_compile
          files = sorted(pathlib.Path(".").rglob("*.py"))
          files = [p for p in files if ".git" not in p.parts]
          print(f"Validando {len(files)} archivos Python...")
          for path in files:
              py_compile.compile(str(path), doraise=True)
          PY

      - name: Ejecutar regresiones de scraping
        run: |
          python -m unittest tests.test_store_discovery_regressions tests.test_product_identifiers tests.test_network_json tests.test_monitor_rules -v
